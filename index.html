  <!DOCTYPE html>
<html>
<head>
  <title>Adaa Kidswear POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { font-family: Arial; background:#f2f2f2; padding:10px; }
    h1 { text-align:center; }
    input, button { padding:10px; margin:5px; width:95%; font-size:16px; }
    .box { background:white; padding:10px; margin-top:10px; border-radius:10px; }
    .item { border-bottom:1px solid #ddd; padding:8px; }
    .row { display:flex; gap:5px; }
    .row input { width:30%; }
    .remove { background:red; color:white; border:none; padding:5px; }
  </style>
</head>

<body>

<h1>🛍️ Adaa Kidswear POS</h1>

<div class="box">
  <input type="number" id="cost" placeholder="Purchase Price ₹">
  <input type="number" id="sell" placeholder="Selling Price ₹">

  <div id="live"></div>

  <button onclick="addItem()">➕ Add Item</button>
</div>

<div class="box">
  <h3>🧾 Current Bill</h3>
  <div id="cart"></div>
</div>

<h3>💸 Discount</h3>
<input type="number" id="discount" placeholder="Enter discount ₹" oninput="updateBillTotal()">  

  <h3>💳 Payment Method</h3>

<select id="paymentMethod" onchange="updateBillTotal()">
  <option value="Cash">💵 Cash</option>
  <option value="UPI">📲 UPI</option>
</select>
  
<h3>🧾 Current Bill Total</h3>
<div>₹<span id="billTotal">0</span></div>
<div class="box">

<h3>💰 Final Payable</h3>
<div>₹<span id="finalTotal">0</span></div>
  
  <h3>📊 Today Summary</h3>
  <div>Items: <span id="items">0</span></div>
  <div>Revenue: ₹<span id="revenue">0</span></div>
  <div>Profit: ₹<span id="profit">0</span></div>
</div>

<div>Total Discounts: ₹<span id="discountTotal">0</span></div>
  
<div class="box">
  <h3>🧾 Transaction History</h3>
  <div id="transactions"></div>
</div>
  
<div class="box">
  <h3>📅 Monthly Summary</h3>
  <div>Revenue: ₹<span id="monthlyRevenue">0</span></div>
  <div>Profit: ₹<span id="monthlyProfit">0</span></div>
</div>

<button onclick="clearBill()">🧹 New Customer</button>
<button onclick="endDay()">📦 End Day</button>
<button onclick="exportPDF()">📄 Export PDF</button>
  <button onclick="generateBillPDF()">🧾 Generate Bill</button>
<button onclick="sharePDF()">📤 Share Bill (WhatsApp)</button>
  <button onclick="resetMonth()">🗑️ Reset Monthly Data</button>


<script>
// ===== DATA =====
let cart = [];
let dailySales = JSON.parse(localStorage.getItem("dailySales") || "[]");
let monthlyData = JSON.parse(localStorage.getItem("monthlyData") || "[]");

// ===== AUTO SAVE =====
function saveData() {
  localStorage.setItem("dailySales", JSON.stringify(dailySales));
  localStorage.setItem("monthlyData", JSON.stringify(monthlyData));
}

// ===== LIVE CALC =====
document.getElementById("cost").addEventListener("input", liveCalc);
document.getElementById("sell").addEventListener("input", liveCalc);

function liveCalc() {
  let cost = +document.getElementById("cost").value || 0;
  let sell = +document.getElementById("sell").value || 0;

  let profit = sell - cost;
  let min = cost * 1.3;

  document.getElementById("live").innerHTML =
    `Min Price: ₹${min.toFixed(0)} | Profit: ₹${profit.toFixed(2)}`;
}

// ===== ADD ITEM =====
function addItem() {
  let cost = +document.getElementById("cost").value;
  let sell = +document.getElementById("sell").value;

  if (!cost || !sell) return alert("Enter values");

  cart.push({ cost, sell, qty: 1 });

  document.getElementById("cost").value = "";
  document.getElementById("sell").value = "";
  document.getElementById("live").innerHTML = "";

  renderCart();
}

// ===== CART RENDER =====
function renderCart() {
  let cartDiv = document.getElementById("cart");
  cartDiv.innerHTML = "";

  cart.forEach((item, index) => {
    let min = item.cost * 1.3;

    let div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      Cost: ₹${item.cost} | Sell: ₹${item.sell} | Min: ₹${min.toFixed(0)}<br>

      <div class="row">
        <input type="number" value="${item.qty}" onchange="updateQty(${index}, this.value)">
        <button class="remove" onclick="removeItem(${index})">X</button>
      </div>

      Profit: ₹${((item.sell - item.cost) * item.qty).toFixed(2)}
    `;

    cartDiv.appendChild(div);
  });

  updateSummary();
  updateBillTotal();
}

// ===== UPDATE CART =====
function updateQty(i, val) {
  cart[i].qty = +val;
  renderCart();
}

function removeItem(i) {
  cart.splice(i, 1);
  renderCart();
}

// ===== MOVE TO DAILY =====
  
function clearBill() {

  if(cart.length === 0) return;

  let payment =
    document.getElementById("paymentMethod").value;

  let discount =
    +document.getElementById("discount").value || 0;

  let grossTotal = 0;

  cart.forEach(item => {
    grossTotal += item.sell * item.qty;
  });

  let finalTotal = grossTotal - discount;

  dailySales.push({
    id: Date.now(),
    date: new Date().toLocaleString(),
    items: [...cart],
    grossTotal: grossTotal,
    discount: discount,
    netTotal: finalTotal,
    payment: payment
  });

  cart = [];

  document.getElementById("discount").value = "";

  saveData();
  renderCart();
  renderTransactions();
  updateSummary();
}

// ===== SUMMARY (ONLY DAILY SALES) =====

function updateSummary() {

  let grossRevenue = 0;
  let totalDiscount = 0;
  let netRevenue = 0;
  let totalProfit = 0;

  dailySales.forEach(sale => {

    grossRevenue += sale.grossTotal;

    totalDiscount += sale.discount;

    netRevenue += sale.netTotal;

    sale.items.forEach(item => {
      totalProfit +=
        ((item.sell - item.cost) * item.qty);
    });

  });

  // subtract discounts from profit
  totalProfit -= totalDiscount;

  document.getElementById("revenue").innerText =
    netRevenue.toFixed(2);

  document.getElementById("profit").innerText =
    totalProfit.toFixed(2);

  document.getElementById("discountTotal").innerText =
  totalDiscount.toFixed(2);
}
  
// ===== END DAY =====
function endDay() {
  if (dailySales.length === 0) return alert("No sales today");

  let revenue = 0;
  let profit = 0;

  dailySales.forEach(item => {
    revenue += item.sell * item.qty;
    profit += (item.sell - item.cost) * item.qty;
  });

  let today = new Date().toLocaleDateString();

  monthlyData.push({ date: today, revenue, profit });

  dailySales = [];
  saveData();
  updateSummary();

  alert("Day Closed & Saved");
}

// ===== MONTHLY =====
function updateMonthly() {
  let totalRevenue = 0;
  let totalProfit = 0;

  monthlyData.forEach(day => {
    totalRevenue += day.revenue;
    totalProfit += day.profit;
  });

  document.getElementById("monthlyRevenue").innerText = totalRevenue.toFixed(2);
  document.getElementById("monthlyProfit").innerText = totalProfit.toFixed(2);
}

// ===== PDF EXPORT =====
function exportPDF() {
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();

  doc.text("Adaa Kidswear - Daily Report", 20, 20);

  let y = 40;

  let allItems = [...dailySales, ...cart];

  if (allItems.length === 0) {
    doc.text("No sales yet", 20, y);
  } else {
    allItems.forEach(item => {
      doc.text(`Cost ₹${item.cost} | Sell ₹${item.sell} x${item.qty}`, 20, y);
      y += 10;
    });
  }

  let revenue = 0;
  let profit = 0;

  allItems.forEach(item => {
  doc.text(
    `₹${item.sell} x ${item.qty} | ${item.payment}`,
    20,
    y
  );
  y += 10;
});

  doc.text("Total Revenue: ₹" + revenue.toFixed(2), 20, y + 10);
  doc.text("Total Profit: ₹" + profit.toFixed(2), 20, y + 20);

  doc.save("daily-report.pdf");
}

  let grossRevenue = 0;
let totalDiscount = 0;
let netRevenue = 0;
let profit = 0;

dailySales.forEach(sale => {

  grossRevenue += sale.grossTotal;
  totalDiscount += sale.discount;
  netRevenue += sale.netTotal;

  sale.items.forEach(item => {
    profit +=
      ((item.sell - item.cost) * item.qty);
  });

});

profit -= totalDiscount;

  doc.text(
  "Gross Sales: ₹" + grossRevenue.toFixed(2),
  20,
  y
);

y += 10;

doc.text(
  "Discount Given: ₹" + totalDiscount.toFixed(2),
  20,
  y
);

y += 10;

doc.text(
  "Net Revenue: ₹" + netRevenue.toFixed(2),
  20,
  y
);

y += 10;

doc.text(
  "Profit: ₹" + profit.toFixed(2),
  20,
  y
);
  
  let lastPDFBlob = null;

function generateBillPDF() {
  if (cart.length === 0) {
    alert("No items in current bill");
    return;
  }

  const { jsPDF } = window.jspdf;
  let doc = new jsPDF({
    unit: "mm",
    format: [80, 200] // receipt size
  });

  let y = 10;

  // Store Name
  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.text("Adaa Kidswear", 40, y, { align: "center" });

  y += 6;

  doc.setFontSize(9);
  doc.setFont("helvetica", "normal");

  let now = new Date();
  doc.text(now.toLocaleString(), 40, y, { align: "center" });

  y += 6;

  doc.text("--------------------------------", 10, y);
  y += 5;

  let total = 0;

  cart.forEach(item => {
    let lineTotal = item.sell * item.qty;
    total += lineTotal;

    // Left: item
    doc.text(`₹${item.sell} x ${item.qty}`, 10, y);

    // Right: total
    doc.text(`₹${lineTotal}`, 70, y, { align: "right" });

    y += 5;
  });

  y += 2;
  doc.text("--------------------------------", 10, y);

  y += 6;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);

  doc.text("TOTAL", 10, y);
  doc.text(`₹${total}`, 70, y, { align: "right" });

  y += 8;

  doc.setFontSize(9);
  doc.setFont("helvetica", "normal");

  doc.text("Thank you! Visit again 🙏", 40, y, { align: "center" });

  // Save PDF blob for sharing
  lastPDFBlob = doc.output("blob");

  // Download automatically
  doc.save("Adaa_Bill.pdf");
}

// SHARE PDF
function sharePDF() {
  if (!lastPDFBlob) {
    alert("Generate bill first");
    return;
  }

  let file = new File([lastPDFBlob], "Adaa_Bill.pdf", {
    type: "application/pdf"
  });

  if (navigator.share) {
    navigator.share({
      title: "Adaa Kidswear Bill",
      files: [file]
    }).catch(err => console.log(err));
  } else {
    alert("Sharing not supported. File downloaded instead.");
  }
}

  if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}

  function renderTransactions() {
  let div = document.getElementById("transactions");

  div.innerHTML = "";

  dailySales.forEach((item, index) => {
    let profit = (item.sell - item.cost) * item.qty;

    let row = document.createElement("div");
    row.className = "item";

    row.innerHTML = `
      ${item.date}<br>
      Cost ₹${item.cost} | Sell ₹${item.sell} x ${item.qty}<br>
      Payment: ${item.payment}<br>
      Profit ₹${profit.toFixed(2)}<br>

      <button onclick="editTransaction(${index})">✏️ Edit</button>
      <button onclick="deleteTransaction(${index})">↩️ Return/Delete</button>
    `;

row.innerHTML = `
  ${sale.date}<br>
  Gross: ₹${sale.grossTotal}<br>
  Discount: ₹${sale.discount}<br>
  Net Sale: ₹${sale.netTotal}<br>
  Payment: ${sale.payment}<br>

  <button onclick="deleteTransaction(${index})">
    ↩️ Return
  </button>
`;
    
    div.appendChild(row);
  });
}

  function deleteTransaction(index) {
  if (!confirm("Delete this transaction?")) return;

  dailySales.splice(index, 1);

  saveData();
  updateSummary();
  renderTransactions();
}

  function editTransaction(index) {
  let item = dailySales[index];

  let newCost = prompt("Edit Purchase Price", item.cost);
  let newSell = prompt("Edit Selling Price", item.sell);
  let newQty = prompt("Edit Quantity", item.qty);

  if (!newCost || !newSell || !newQty) return;

  item.cost = +newCost;
  item.sell = +newSell;
  item.qty = +newQty;

  saveData();
  updateSummary();
  renderTransactions();
}

  function resetMonth() {
  let confirmReset = confirm(
    "Are you sure you want to reset ALL monthly data?"
  );

  if (!confirmReset) return;

  monthlyData = [];

  saveData();
  updateMonthly();

  alert("Monthly data reset successfully");
}

 function updateBillTotal() {
  let total = 0;

  cart.forEach(item => {
    total += item.sell * item.qty;
  });

  let discount = +document.getElementById("discount")?.value || 0;

  let finalAmount = total - discount;

  if (finalAmount < 0) finalAmount = 0;

  document.getElementById("billTotal").innerText = total.toFixed(2);
  document.getElementById("finalTotal").innerText = finalAmount.toFixed(2);
}
  
// ===== INIT =====
updateSummary();
  renderTransactions();
</script>

</body>
</html>
